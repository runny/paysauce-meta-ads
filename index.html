<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaySauce Meta Ads &middot; Delivery</title>
<style>
  /* The delivery page. ONE template, rendered twice: here from campaigns.js, and in the public repo
     from the copy publish-delivery.py pushes. Never hand-edit the repo version.

     Campaign first, then ads. The rounds view lives on in the Creative Preview page, where
     work-in-progress belongs; this page is only about what is shipping. */
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{background:#1d1d1b; color:#f2f1ee; display:flex; flex-direction:column;
    font:15px/1.5 -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden}

  header{flex:none; display:flex; align-items:center; gap:16px; padding:34px 40px 26px}
  #title{font-size:21px; font-weight:700; letter-spacing:-.01em}
  #sub{color:#8f8e89; font-size:14px}
  #spacer{flex:1}
  #stamp{color:#6f6e6a; font-size:12px; font-family:"SF Mono",ui-monospace,Menlo,monospace}
  /* The publish control states what is true before it offers an action: nothing to publish, or
     these many changes are not live yet. A button with no state just invites blind pressing. */
  #pubwrap{display:flex; align-items:center; gap:12px}
  #pubstate{font-size:12px; color:#6f6e6a; text-align:right; line-height:1.35; max-width:230px}
  #pub{background:none; border:1px solid #3a3a37; border-radius:999px; color:#8f8e89;
    font:inherit; font-size:13px; font-weight:650; padding:8px 20px; cursor:not-allowed}
  #pub.ready{border-color:#C9A227; color:#F0D67A; cursor:pointer}
  #pub.ready:hover{background:#C9A227; border-color:#C9A227; color:#1d1d1b}
  #pub.busy{cursor:progress; opacity:.6}
  #pubwrap.dirty #pubstate{color:#F0D67A}
  #pubwrap.dirty::before{content:""; width:7px; height:7px; border-radius:50%; background:#F0D67A}

  #back{background:none; border:none; color:#8f8e89; cursor:pointer; font:inherit; font-size:15px;
    padding:0; display:none}
  #back:hover{color:#f2f1ee}
  /* LEVEL ONE: a plain vertical list of campaigns and nothing else. */
  #home{flex:1; min-height:0; overflow-y:auto; padding:0 40px 40px}
  .slat{display:flex; align-items:center; gap:16px; width:100%; text-align:left; background:none;
    border:1px solid #34342f; border-radius:14px; color:#f2f1ee; cursor:pointer; font:inherit;
    font-size:18px; font-weight:650; letter-spacing:-.01em; padding:26px 28px; margin-bottom:12px}
  .slat:hover{border-color:#6a6a62; background:#232320}
  .slat .n{color:#6f6e6a; font-size:12.5px; font-weight:400; margin-left:auto}
  .slat .ch{color:#6f6e6a; font-size:18px}
  #vlist{width:190px; flex:none; padding-top:2px; overflow-y:auto; scrollbar-width:none}
  #vlist::-webkit-scrollbar{display:none}
  #vlist button{display:block; width:100%; text-align:left; background:none; border:none;
    color:#8f8e89; font:inherit; font-size:15px; padding:9px 0; cursor:pointer}
  #vlist button:hover{color:#dddcd7}
  #vlist button.on{color:#fff; font-weight:650}
  #oldtabs{display:none}
  #tabs button{background:none; border:1px solid #3a3a37; border-radius:999px; color:#c9c8c3;
    cursor:pointer; font:inherit; font-size:14px; padding:8px 18px}
  #tabs button:hover{border-color:#575652; color:#fff}
  #tabs button.on{background:#f2f1ee; border-color:#f2f1ee; color:#1d1d1b; font-weight:650}
  #tabs button .st{display:block; font-size:11px; font-weight:400; opacity:.65; margin-top:1px}
  .qbox .res{margin-top:11px; padding-top:11px; border-top:1px solid #34342f; color:#a2a19c;
    font-size:12.5px; line-height:1.55}
  .qbox .res b{color:#e8e7e3}
  #adlist button.hist{color:#6f6e6a}
  .histbox{max-width:420px; text-align:center; color:#8f8e89}
  .histbox .h1{font-size:15px; font-weight:650; color:#c9c8c3}
  .histbox p{margin-top:10px; font-size:13px; line-height:1.6}

  main{flex:1; min-height:0; display:none; gap:40px; padding:0 40px 34px}
  main.on{display:flex}
  #left{width:230px; flex:none; overflow-y:auto; scrollbar-width:none}
  #left::-webkit-scrollbar{display:none}
  .qbox{border:1px solid #34342f; border-radius:12px; padding:16px 17px; margin-bottom:20px}
  .qbox .q{font-size:15px; font-weight:650; line-height:1.35}
  .qbox .d{margin-top:9px; color:#a2a19c; font-size:12.5px; line-height:1.55}
  #adlist button{display:block; width:100%; text-align:left; background:none; border:none;
    color:#8f8e89; font:inherit; font-size:15px; padding:9px 0; cursor:pointer}
  #adlist button:hover{color:#dddcd7}
  #adlist button.on{color:#fff; font-weight:650}
  #adlist .ap{display:block; font-size:11.5px; color:#6f6e6a; font-weight:400; margin-top:1px}

  #gallery{flex:1; min-width:0; display:flex; align-items:center; justify-content:center; padding-bottom:14px}
  .vrow{display:flex; gap:38px; align-items:flex-start; justify-content:center}
  .tile{flex:none; width:min(calc((100vh - 340px) * 0.5625), calc((100% - 76px) / 3)); min-width:0}
  .tile img{width:100%; display:block; box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .tmeta{display:flex; align-items:center; justify-content:space-between; margin-top:9px}
  .tcap{color:#8f8e89; font-size:11px; font-family:"SF Mono",ui-monospace,Menlo,monospace}
  .tbtns a{display:flex; align-items:center; justify-content:center; width:28px; height:28px;
    border:1px solid #3a3a37; border-radius:7px; color:#c9c8c3; text-decoration:none}
  .tbtns a:hover{border-color:#575652; color:#fff}
  .tbtns svg{width:14px; height:14px}

  #meta{width:330px; flex:none; overflow-y:auto; padding-bottom:40px; scrollbar-width:none}
  #meta::-webkit-scrollbar{display:none}
  #meta h2{font-size:11px; font-weight:650; letter-spacing:.1em; text-transform:uppercase;
    color:#8f8e89; margin:24px 0 10px}
  #meta h2:first-child{margin-top:0}
  #jobcode{font-family:"SF Mono",ui-monospace,Menlo,monospace; font-size:12.5px; color:#dddcd7;
    background:#242422; border:1px solid #3a3a37; border-radius:8px; padding:9px 11px}
  .mlabel{color:#8f8e89; font-size:12px; margin:14px 0 4px}
  .mval{color:#e8e7e3; font-size:14px; line-height:1.55}
  .ctachip{display:inline-block; background:#3a3a37; border-radius:7px; padding:5px 12px;
    font-size:13px; font-weight:600}
  .filerow{display:flex; gap:8px; align-items:center}
  .filerow code{flex:1; font-family:"SF Mono",ui-monospace,Menlo,monospace; font-size:12px;
    color:#dddcd7; background:#242422; border:1px solid #3a3a37; border-radius:8px;
    padding:9px 11px; overflow-wrap:anywhere}
  .filerow button{background:none; border:1px solid #3a3a37; border-radius:8px; color:#f2f1ee;
    font-size:12px; padding:8px 12px; cursor:pointer}
  .filerow button:hover{border-color:#575652}
  .standing{border-top:1px solid #2f2f2b; margin-top:26px; padding-top:18px}
  .standing div{color:#a2a19c; font-size:12.5px; line-height:1.6; margin-bottom:11px}
  .standing b{color:#e8e7e3; font-weight:650}
  .note{border-left:2px solid #4a4a44; padding-left:12px; color:#a2a19c; font-size:12.5px;
    line-height:1.6; margin-top:12px}

  /* PHONE PREVIEW. Yash gets the art and the words here; this shows what the two look like once
     Meta puts them together on a phone. It is a MOCK of the placement, not Meta's own renderer:
     placement-previews.html asks Meta to draw the real thing, but those iframes need a logged-in
     Facebook session and so cannot work on a public page. This one needs nothing.
     Deliberately honest about padding: a square dropped into a story slot is drawn the way it
     really arrives, letterboxed, rather than cropped to look correct. */
  #pvwrap{position:fixed; inset:0; z-index:60; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; padding:22px;
    background:rgba(10,10,9,.88); backdrop-filter:blur(7px)}
  #pvwrap.on{display:flex}
  .pvbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center}
  .pvchip{background:none; border:1px solid #3a3a37; border-radius:999px; color:#c9c8c3;
    font:inherit; font-size:12.5px; padding:6px 14px; cursor:pointer}
  .pvchip:hover{border-color:#6a6a62; color:#fff}
  .pvchip.on{background:#f2f1ee; border-color:#f2f1ee; color:#1d1d1b; font-weight:650}
  .pvname{color:#8f8e89; font-size:12.5px; font-family:"SF Mono",ui-monospace,Menlo,monospace}
  #pvclose{position:absolute; top:18px; right:22px; background:none; border:1px solid #3a3a37;
    border-radius:999px; color:#c9c8c3; font:inherit; font-size:13px; padding:7px 16px; cursor:pointer}
  #pvclose:hover{border-color:#6a6a62; color:#fff}
  .phone{position:relative; flex:none; width:390px; max-width:100%; height:min(812px, calc(100vh - 170px));
    background:#0b0b0a; border-radius:46px; padding:11px; box-shadow:0 34px 90px rgba(0,0,0,.65),
    inset 0 0 0 1px #35352f}
  .screen{position:relative; width:100%; height:100%; border-radius:36px; overflow:hidden;
    background:#fff; display:flex; flex-direction:column;
    font:14px/1.45 -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif; color:#050505}
  .notch{position:absolute; top:11px; left:50%; transform:translateX(-50%); width:112px; height:24px;
    background:#0b0b0a; border-radius:0 0 15px 15px; z-index:5}
  .statusbar{flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:9px 22px 4px; font-size:12px; font-weight:650; color:#050505}
  .statusbar.dark{color:#fff}
  .appbar{flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:6px 14px 8px; border-bottom:1px solid #E9EAEC}
  .appbar b{font-size:19px; letter-spacing:-.02em}
  .appbar .ic{display:flex; gap:14px; color:#65676B; font-size:15px}
  .feed{flex:1; min-height:0; overflow-y:auto; background:#fff}
  .feed::-webkit-scrollbar{width:0}
  .prow{display:flex; align-items:center; gap:9px; padding:12px 14px 8px}
  .pav{width:40px; height:40px; border-radius:50%; background:#2B5945; flex:none;
    display:flex; align-items:center; justify-content:center}
  .pav svg{width:17px; height:20px}
  .pname{font-size:14px; font-weight:650; line-height:1.25}
  .psub{color:#65676B; font-size:12px}
  .ptext{padding:2px 14px 10px; font-size:14.5px; line-height:1.42; white-space:pre-wrap}
  .pimg{display:block; width:100%; background:#EDEEF0}
  .ctabar{display:flex; align-items:center; gap:12px; background:#F2F3F5; padding:10px 14px}
  .ctabar .t{flex:1; min-width:0}
  .ctadom{font-size:11px; color:#65676B; letter-spacing:.02em; text-transform:uppercase}
  .ctahead{font-size:15px; font-weight:650; line-height:1.25; margin-top:1px}
  .ctadesc{font-size:12.5px; color:#65676B; margin-top:1px}
  .ctabtn{flex:none; background:#E4E6EB; border-radius:6px; padding:9px 13px; font-size:13px;
    font-weight:650; white-space:nowrap}
  .prow2{display:flex; justify-content:space-around; border-top:1px solid #E9EAEC;
    padding:9px 0; color:#65676B; font-size:13px; font-weight:650}
  .igacts{display:flex; gap:16px; padding:10px 14px 4px; color:#050505; font-size:13px; font-weight:650}
  .igcap{padding:0 14px 14px; font-size:13.5px; line-height:1.42}
  .igcap b{font-weight:650}
  .igcta{display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 14px; border-top:1px solid #E9EAEC; border-bottom:1px solid #E9EAEC;
    font-size:14px; font-weight:650}
  .igcta span{color:#65676B; font-weight:400; font-size:18px}
  .story{position:relative; flex:1; min-height:0; background:#000; display:flex;
    align-items:center; justify-content:center; overflow:hidden}
  .story img{max-width:100%; max-height:100%; object-fit:contain; display:block}
  .sprog{position:absolute; top:34px; left:12px; right:12px; height:3px; border-radius:2px;
    background:rgba(255,255,255,.35)}
  .sprog i{display:block; width:36%; height:100%; border-radius:2px; background:#fff}
  .shead{position:absolute; top:46px; left:12px; right:12px; display:flex; align-items:center;
    gap:8px; color:#fff; font-size:13px; text-shadow:none}
  .shead .pav{width:30px; height:30px}
  .shead .pav svg{width:13px; height:15px}
  .sname{font-weight:650}
  .ssub{color:rgba(255,255,255,.75); font-size:11.5px}
  .sfoot{position:absolute; left:0; right:0; bottom:20px; display:flex; flex-direction:column;
    align-items:center; gap:8px; color:#fff}
  .sfoot .chev{font-size:15px; opacity:.9}
  .sfoot .pill{background:rgba(255,255,255,.95); color:#111; border-radius:999px;
    padding:9px 22px; font-size:13.5px; font-weight:650}
  .pvhint{color:#6f6e6a; font-size:12px}
  .tile img{cursor:zoom-in}
</style>
</head>
<body>
  <header>
    <button id="back">&#8592;&nbsp; Campaigns</button>
    <div id="title">PaySauce Meta Ads</div>
    <div id="spacer"></div>
    <div id="pubwrap">
      <div id="pubstate">checking…</div>
      <button id="pub" disabled>Publish</button>
    </div>
    <div id="stamp"></div>
  </header>
  <div id="home"></div>
  <main>
    <div id="vlist"></div>
    <div id="gallery"></div>
    <div id="meta"></div>
  </main>

  <div id="pvwrap">
    <button id="pvclose">Close &nbsp;esc</button>
    <div class="pvbar" id="pvplace"></div>
    <div class="phone"><div class="notch"></div><div class="screen" id="pvscreen"></div></div>
    <div class="pvbar" id="pvsize"></div>
    <div class="pvhint" id="pvhint"></div>
  </div>

<script src="campaigns.js?v=d6bd422f3e"></script>
<script>
"use strict";
const C = window.CAMPAIGNS, S = C.sizes;
let ci = -1, ai = 0;                       // ci -1 means the campaign list
const $ = (id) => document.getElementById(id);
const CAMP = () => C.campaigns[ci];
const AD = () => CAMP().ads[ai];
const fileFor = (a, s) => a.code + '-' + a.key + '_' + S[s].file + '.png';
const srcFor = (a, s) => a.dir + fileFor(a, s);

function readHash() {
  const h = location.hash.slice(1);
  ci = h ? C.campaigns.findIndex((x) => x.id === h) : -1;
  ai = 0;
}
/* Same-page anchors change the hash without reloading, so the page listens rather than reading it
   once at load. That exact bug cost two rounds on the previous delivery page. */
window.addEventListener('hashchange', () => { readHash(); render(); });

function render() {
  $('stamp').textContent = 'updated ' + C.updated;
  const inCampaign = ci >= 0;
  $('home').style.display = inCampaign ? 'none' : 'block';
  document.querySelector('main').classList.toggle('on', inCampaign);
  $('back').style.display = inCampaign ? 'block' : 'none';
  $('title').textContent = inCampaign ? CAMP().name : 'PaySauce Meta Ads';

  if (!inCampaign) {
    $('home').innerHTML = C.campaigns.map((c) =>
      '<button class="slat" data-go="' + c.id + '">' + c.name +
      '<span class="n">' + c.ads.length + ' ads</span><span class="ch">&#8250;</span></button>').join('');
    return;
  }

  const list = $('vlist'); list.innerHTML = '';
  CAMP().ads.forEach((a, i) => {
    const b = document.createElement('button');
    b.textContent = a.label;
    if (i === ai) b.className = 'on';
    b.addEventListener('click', () => { ai = i; render(); });
    list.appendChild(b);
  });

  const a = AD();
  $('gallery').innerHTML = '<div class="vrow">' + S.map((s, i) =>
    '<div class="tile"><img src="' + srcFor(a, i) + '" alt="">' +
    '<div class="tmeta"><div class="tcap">' + s.label + ' &middot; ' + s.file.split('_')[1] + '</div>' +
    '<div class="tbtns"><a href="' + srcFor(a, i) + '" download="' + fileFor(a, i) + '" title="Download">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
    'stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>' +
    '</a></div></div></div>').join('') + '</div>';

  const utm = 'BE-' + CAMP().id.replace('campaign-', 'c') + '-' + a.slug;
  /* Most ads are instant-form and their only link is the form's thank-you screen. An ad that
     declares `landing` sends traffic to a page instead, so the tagged URL is the ad's own
     destination and it says so, rather than sitting under a label that means something else. */
  const base = a.landing || C.standing.thankYouLink;
  const link = base + '?utm_source=facebook&utm_medium=paid-social&utm_content=' + utm;
  const linkLabel = a.landing
    ? 'Ad destination URL (tagged, paste as the ad\u2019s website URL)'
    : 'Thank-you screen link (the only place a link goes)';
  $('meta').innerHTML =
    '<h2>Job</h2><div id="jobcode">' + a.code + ' &middot; ' + a.key + '</div>' +
    '<h2>Facebook post</h2>' +
    '<div class="mlabel">Primary text (one only; Meta writes the variations)</div>' +
    '<div class="filerow"><code>' + a.primary + '</code>' +
    '<button class="cp" data-v="' + a.primary.replace(/"/g, '&quot;') + '">Copy</button></div>' +
    '<div class="mlabel">Headline</div><div class="mval">' + a.headline + '</div>' +
    '<div class="mlabel">Description</div><div class="mval">' + a.desc + '</div>' +
    '<div class="mlabel">Call to action</div><div class="mval"><span class="ctachip">' + a.cta + '</span></div>' +
    '<h2>Setup</h2>' +
    '<div class="mlabel">Destination</div><div class="mval">' + (a.destination || C.standing.destination) + '</div>' +
    '<div class="mlabel">URL parameters</div>' +
    '<div class="filerow"><code>utm_content=' + utm + '</code>' +
    '<button class="cp" data-v="utm_content=' + utm + '">Copy</button></div>' +
    '<div class="mlabel">' + linkLabel + '</div>' +
    '<div class="filerow"><code>' + link + '</code><button class="cp" data-v="' + link + '">Copy</button></div>' +
    '<div class="mlabel">Ad name in Ads Manager</div>' +
    '<div class="filerow"><code>' + fileFor(a, 1) + '</code>' +
    '<button class="cp" data-v="' + fileFor(a, 1) + '">Copy</button></div>' +
    '<div class="standing">' +
      '<div><b>Ad set.</b> ' + C.standing.adSet + '</div>' +
      '<div><b>Budget.</b> ' + C.standing.budget + '</div>' +
      '<div><b>Text.</b> ' + C.standing.text + '</div>' +
      '<div><b>Naming.</b> ' + C.standing.naming + '</div>' +
      '<div><b>Then leave it.</b> ' + C.standing.freeze + '</div>' +
    '</div>';
}

document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]');
  if (go) { location.hash = go.dataset.go; return; }
  if (e.target.closest('#back')) { location.hash = ''; ci = -1; render(); return; }
  const b = e.target.closest('.cp');
  if (!b) return;
  const done = () => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1200); };
  if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.v).then(done, () => {});
  else done();
});
/* ---- PHONE PREVIEW ----------------------------------------------------------------------
   Click any render to see it as a post. Two switchers: the placement (Facebook feed, Instagram
   feed, story) and which of the three sizes is in it. They are independent on purpose, because the
   useful question is often "what happens if the square runs in the story slot", and the answer is
   the letterboxing you can see here rather than a rule someone has to remember. */
const SPLODGE = '<svg viewBox="0 0 26.454 32" fill="none" xmlns="http://www.w3.org/2000/svg">' +
  '<path fill-rule="evenodd" clip-rule="evenodd" d="M9.48692 20.275C8.6965 20.5896 7.83474 20.7626 ' +
  '6.93275 20.7626V30.2942C6.93275 31.201 6.19762 31.9362 5.29078 31.9362C4.38395 31.9362 3.64882 ' +
  '31.201 3.64882 30.2942V19.9337C1.47642 18.7584 0 16.4533 0 13.802C0 11.1434 1.48451 8.83297 ' +
  '3.66666 7.66067C3.53599 7.16541 3.46638 6.64521 3.46638 6.10869C3.46638 2.77028 6.16186 0.0639648 ' +
  '9.48692 0.0639648C11.7355 0.0639648 13.6961 1.30156 14.7299 3.13532C15.7513 2.69131 16.8778 ' +
  '2.44522 18.0616 2.44522C22.6966 2.44522 26.4539 6.21766 26.4539 10.8712C26.4539 15.5247 22.6966 ' +
  '19.2972 18.0616 19.2972C16.0838 19.2972 14.2658 18.6103 12.8314 17.4611C12.8115 17.4934 12.7913 ' +
  '17.5255 12.7709 17.5575V22.0514C12.7709 22.9582 12.0357 23.6933 11.1289 23.6933C10.2221 23.6933 ' +
  '9.48692 22.9582 9.48692 22.0514V20.275ZM11.1289 25.5251C12.0357 25.5251 12.7709 26.2602 12.7709 ' +
  '27.167V27.1802C12.7709 28.0871 12.0357 28.8222 11.1289 28.8222C10.2221 28.8222 9.48692 28.0871 ' +
  '9.48692 27.1802V27.167C9.48692 26.2602 10.2221 25.5251 11.1289 25.5251Z" fill="#FFFFFF"/></svg>';

const PLACES = [
  { k: 'fb',    label: 'Facebook feed' },
  { k: 'ig',    label: 'Instagram feed' },
  { k: 'story', label: 'Story and Reels' }
];
let pvSize = 1, pvPlace = 'fb', pvOpen = false;

function domainOf(a) {
  const u = a.landing || C.standing.thankYouLink || '';
  return u.replace(/^https?:\/\//, '').replace(/^www\./, '').split('/')[0];
}
function esc(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function feedPost(a, src, ig) {
  const head =
    '<div class="prow"><div class="pav">' + SPLODGE + '</div>' +
    '<div><div class="pname">' + (ig ? 'paysauce' : 'PaySauce') + '</div>' +
    '<div class="psub">Sponsored' + (ig ? '' : ' &middot; &#127760;') + '</div></div></div>';
  const img = '<img class="pimg" src="' + src + '" alt="">';
  if (ig) {
    /* Instagram puts the caption UNDER the image and the action link in a bar of its own, which is
       why the same words land in a different order from Facebook. */
    return head + img +
      '<div class="igcta">' + esc(a.cta) + '<span>&#8250;</span></div>' +
      '<div class="igacts"><span>&#9825; Like</span><span>&#9711; Comment</span><span>&#10148; Share</span></div>' +
      '<div class="igcap"><b>paysauce</b> ' + esc(a.primary) + '</div>';
  }
  return head +
    '<div class="ptext">' + esc(a.primary) + '</div>' + img +
    '<div class="ctabar"><div class="t">' +
      '<div class="ctadom">' + esc(domainOf(a)) + '</div>' +
      '<div class="ctahead">' + esc(a.headline) + '</div>' +
      '<div class="ctadesc">' + esc(a.desc) + '</div></div>' +
      '<div class="ctabtn">' + esc(a.cta) + '</div></div>' +
    '<div class="prow2"><span>&#9825; Like</span><span>&#9711; Comment</span><span>&#10148; Share</span></div>';
}

function drawPreview() {
  const a = AD(), src = srcFor(a, pvSize), story = pvPlace === 'story';
  const bar = (id, items, cur, attr) => {
    document.getElementById(id).innerHTML = items.map((it) =>
      '<button class="pvchip' + (it.v === cur ? ' on' : '') + '" data-' + attr + '="' + it.v + '">' +
      it.label + '</button>').join('');
  };
  bar('pvplace', PLACES.map((p) => ({ v: p.k, label: p.label })), pvPlace, 'pvplace');
  bar('pvsize', S.map((sz, i) => ({ v: i, label: sz.label })), pvSize, 'pvsize');

  const screen = document.getElementById('pvscreen');
  const status = '<div class="statusbar' + (story ? ' dark' : '') + '"><span>9:41</span>' +
                 '<span>&#9679;&#9679;&#9679;&#9679; &#9207;</span></div>';
  if (story) {
    screen.innerHTML =
      '<div class="story"><img src="' + src + '" alt="">' +
      '<div class="sprog"><i></i></div>' +
      '<div class="shead"><div class="pav">' + SPLODGE + '</div>' +
        '<div><div class="sname">paysauce</div><div class="ssub">Sponsored</div></div></div>' +
      '<div class="sfoot"><div class="chev">&#9650;</div><div class="pill">' + esc(a.cta) + '</div></div>' +
      status.replace('class="statusbar dark"', 'class="statusbar dark" style="position:absolute;top:0;left:0;right:0;z-index:4"') +
      '</div>';
  } else {
    const ig = pvPlace === 'ig';
    screen.innerHTML = status +
      '<div class="appbar"><b style="color:' + (ig ? '#050505' : '#0866FF') + '">' +
        (ig ? 'Instagram' : 'facebook') + '</b>' +
      '<div class="ic"><span>&#9906;</span><span>&#9993;</span></div></div>' +
      '<div class="feed">' + feedPost(a, src, ig) + '</div>';
  }
  document.getElementById('pvhint').textContent =
    a.code + ' · ' + a.key + ' · ' + S[pvSize].label + ' in the ' +
    PLACES.filter((p) => p.k === pvPlace)[0].label.toLowerCase() +
    (story && S[pvSize].key !== '9x16'
      ? '. Letterboxed, exactly as this size arrives in a full-height slot.' : '');
}

function openPreview(sizeIdx) {
  pvSize = sizeIdx;
  pvPlace = S[sizeIdx].key === '9x16' ? 'story' : 'fb';
  pvOpen = true;
  drawPreview();
  document.getElementById('pvwrap').classList.add('on');
}
function closePreview() {
  pvOpen = false;
  document.getElementById('pvwrap').classList.remove('on');
}

document.addEventListener('click', (e) => {
  const sz = e.target.closest('[data-pvsize]');
  if (sz) { pvSize = +sz.dataset.pvsize; drawPreview(); return; }
  const pl = e.target.closest('[data-pvplace]');
  if (pl) { pvPlace = pl.dataset.pvplace; drawPreview(); return; }
  if (e.target.closest('#pvclose')) { closePreview(); return; }
  if (pvOpen && e.target.id === 'pvwrap') { closePreview(); return; }
  const tile = e.target.closest('.tile');
  if (tile && e.target.tagName === 'IMG') {
    const tiles = [].slice.call(document.querySelectorAll('#gallery .tile'));
    openPreview(tiles.indexOf(tile));
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && pvOpen) closePreview(); });

readHash();
render();
</script>
</body>
</html>
